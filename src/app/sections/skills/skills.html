<section class="skills" id="skills">
  <div class="skills__inner">
    <div class="skills__box">
      <!-- The heading breaks through the top border, so that line is built from
           two segments, one to the left and one to the right of the title. -->
      <div class="skills__head">
        <span class="skills__rule" aria-hidden="true"></span>
        <h2 class="section-title">{{ t('skills.title') }}</h2>
        <span class="skills__rule" aria-hidden="true"></span>
      </div>

      <ul class="skills__grid">
        @for (skill of skills; track skill.name) {
          <li class="skill">
            <!-- The icon travels out of its 100px frame and back in on hover,
                 so it needs a window to disappear into. -->
            <span class="skill__figure" aria-hidden="true">
              <img
                class="skill__icon"
                [src]="'assets/icons/' + skill.icon + '.svg'"
                alt=""
                width="75"
                height="75"
              />
            </span>
            <span class="skill__name">{{ skill.name }}</span>
          </li>
        }
      </ul>

      <p class="skills__more">
        <img src="assets/icons/learn.svg" alt="" width="75" height="75" />
        <span>
          {{ t('skills.question') }}
          <a href="#contact">{{ t('skills.cta') }}</a>
          {{ t('skills.closing') }}
        </span>
      </p>
    </div>
  </div>

  <img class="skills__arrow" src="assets/icons/arrow-right.svg" alt="" aria-hidden="true" />
</section>
