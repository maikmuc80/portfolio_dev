<section class="about" id="about">
  <div class="about__inner">
    <div class="about__text">
      <h2 class="section-title">{{ t('about.title') }}</h2>

      <p class="about__body">{{ t('about.text') }}</p>

      <ul class="about__facts">
        <li>
          <img src="assets/icons/house.svg" alt="" width="37" height="29" />
          <span>{{ t('about.location') }}</span>
        </li>
        <li>
          <img src="assets/icons/laptop.svg" alt="" width="40" height="29" />
          <span>{{ t('about.remote') }}</span>
        </li>
      </ul>

      <a class="btn about__cta" href="#contact" appSmoothAnchor="contact" [scrollDuration]="100">{{
        t('about.cta')
      }}</a>
    </div>

    <!-- The offset frame from Figma "16.photo interaction" appears on hover,
         so the photo needs a positioned wrapper to hang it off. -->
    <div class="about__figure">
      <img
        class="about__photo"
        src="assets/img/portrait-832.webp"
        srcset="assets/img/portrait-533.webp 533w, assets/img/portrait-832.webp 832w"
        sizes="(min-width: 768px) 533px, calc(100vw - 48px)"
        width="533"
        height="656"
        [alt]="t('about.photoAlt')"
      />
    </div>
  </div>

  <img class="about__arrow" appInView src="assets/icons/arrow-left.svg" alt="" aria-hidden="true" />
</section>
