<section class="portfolio">
  <h2>Portfolio</h2>

  <div class="project-list">
    @for (project of projects; track project.title) {
      <article class="project">
        <h3>{{ project.title }}</h3>
        <p>{{ project.description }}</p>

        <ul class="tags">
          @for (tag of project.tags; track tag) {
            <li>{{ tag }}</li>
          }
        </ul>
      </article>
    }
  </div>
</section>
