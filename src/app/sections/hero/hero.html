<section class="hero" id="hero">
  <div class="hero__inner">
    <h1 class="hero__title">
      <span class="hero__line">{{ t('hero.line1') }}</span>
      <span class="hero__line">{{ t('hero.line2') }}</span>
    </h1>

    <p class="hero__name">
      <span class="hero__rule" aria-hidden="true"></span>
      <span>{{ profile.name }}</span>
    </p>

    <div class="hero__meta">
      <a class="hero__email" [href]="'mailto:' + profile.email">{{ profile.email }}</a>

      <a class="hero__scroll" href="#about" appSmoothAnchor="about" [scrollDuration]="100">
        <!-- Figma "15. arrow" (328:1450) clips the arrow inside the component
             box while it travels downwards, so it needs its own window. -->
        <span class="hero__scroll-window" aria-hidden="true">
          <img src="assets/icons/arrow-down.svg" alt="" width="56" height="98" />
        </span>
        <span>{{ t('hero.scroll') }}</span>
      </a>
    </div>
  </div>
</section>
