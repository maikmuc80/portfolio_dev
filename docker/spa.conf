# Single page app fallback.
#
# Only index.html exists on disk — /impressum and /datenschutz are Angular
# routes drawn by JavaScript. Clicking a link inside the site never reaches the
# server, but a direct request, a reload or a shared link does. Without the
# rewrite Apache answers 404 and Angular never boots.
#
# The -f / -d tests come before the catch-all so real files keep their normal
# path: the hashed bundles, the images, and sendMail.php — which would
# otherwise be answered with index.html and break the contact form.
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted

    RewriteEngine On

    # www goes to the bare domain, permanently.
    #
    # index.html names https://maik-radke.de/ as its canonical URL, so serving
    # the same pages under www as well would offer search engines two addresses
    # for one site. Written without naming the domain: whatever host arrives,
    # the leading www is dropped, so a second domain needs no edit here.
    #
    # It sits inside <Directory> and not in server context, even though a host
    # redirect is not a per-directory concern: rewrite rules at server level are
    # not inherited into a virtual host, and this image serves through the
    # default vhost, where they would simply never run.
    #
    # First, so it also catches requests for files that exist — the -f test
    # below ends rule processing, and favicon.ico under the wrong host would
    # otherwise be served instead of redirected. The health check calls
    # 127.0.0.1 and never matches.
    #
    # None of this fires unless the reverse proxy hands www requests to this
    # container at all: that needs the domain listed on the Coolify application,
    # which is also what gets it into the TLS certificate.
    RewriteCond %{HTTP_HOST} ^www\.([^:]+) [NC]
    RewriteRule ^ https://%1%{REQUEST_URI} [R=301,L]

    RewriteCond %{REQUEST_FILENAME} -f [OR]
    RewriteCond %{REQUEST_FILENAME} -d
    RewriteRule ^ - [L]
    RewriteRule ^ /index.html [L]
</Directory>

# Bundle names carry a content hash, so they can never go stale under the same
# name and may be cached indefinitely.
<FilesMatch "-[A-Z0-9]{8}\.(js|css)$">
    Header set Cache-Control "public, max-age=31536000, immutable"
</FilesMatch>

<FilesMatch "\.(woff2?|png|jpe?g|webp|svg|ico)$">
    Header set Cache-Control "public, max-age=2592000"
</FilesMatch>

# index.html points at the hashed bundles, so it must never be cached — else a
# deployment stays invisible until the browser happens to revalidate.
<FilesMatch "^index\.html$">
    Header set Cache-Control "no-cache, must-revalidate"
</FilesMatch>

# The access log carries no client IP. Nothing here needs one, and not
# collecting it beats promising a deletion period that no part of this image
# enforces — the container logs to stdout and retention is the host's business.
#
# This redefines the "combined" nickname the default vhost already uses:
# conf-enabled is read before sites-enabled, so this definition is the one in
# force and the vhost needs no patching.
LogFormat "%t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" combined

Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Cross-Origin-Opener-Policy "same-origin"

# Traefik terminates TLS in front of this container, so the client sees HTTPS
# and honours the policy. No preload — that would be hard to walk back.
Header always set Strict-Transport-Security "max-age=31536000"

# Fonts are bundled through @fontsource, so nothing external is needed and the
# policy can stay tight. Two concessions to how Angular builds index.html:
#   style-src 'unsafe-inline' — the critical CSS is inlined in a <style> block
#     whose content changes every build, so a hash would break each release.
#   'unsafe-hashes' + the sha256 — the deferred stylesheet carries an inline
#     onload="this.media='all'" handler. Blocking it would leave the sheet at
#     media="print", i.e. the site would render without its main CSS.
Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"

# The server version is not useful to anyone but an attacker.
ServerTokens Prod
ServerSignature Off
